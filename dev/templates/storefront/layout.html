<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinayaka File Works</title>
    <style>
      :root {
        --bg: #f6f0e8;
        --card: #ffffff;
        --text: #231b17;
        --muted: #6b5d55;
        --primary: #7c4a2d;
        --primary-dark: #4a2c1b;
        --line: #e7dccf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, #faf6f1 0%, #efe5d8 100%);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 56px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--primary-dark);
      }
      nav {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.55);
      }
      .button.primary {
        background: var(--primary);
        color: white;
        border-color: transparent;
      }
      .muted { color: var(--muted); }
      main { padding-top: 28px; }
      .hero {
        background: rgba(255,255,255,0.6);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px;
      }
      footer {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand"><a href="/">Vinayaka File Works</a></div>
        <nav>
          <a href="/">Home</a>
          <a href="/products">Products</a>
        </nav>
      </header>

      <main>
        {% block content %}{% endblock %}
      </main>

      <footer>
        Vinayaka File Works • Storefront MVP
      </footer>
    </div>
  </body>
</html>
